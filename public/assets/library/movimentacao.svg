<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-label="Movimentação">
  <defs>
    <radialGradient id="light" cx="0.86" cy="0.3" r="0.7"><stop offset="0" stop-color="#ffffff" stop-opacity="0.1"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/></radialGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1"><stop offset="0.48" stop-color="#050607" stop-opacity="0"/><stop offset="1" stop-color="#050607" stop-opacity="0.92"/></linearGradient>
    <linearGradient id="trail" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2F80FF" stop-opacity="0"/><stop offset="1" stop-color="#2F80FF"/></linearGradient>
    <marker id="head" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 1 8 5 0 9z" fill="#2F80FF"/></marker>
  </defs>
  <rect width="640" height="400" fill="#08090a"/>
  <rect width="640" height="400" fill="url(#light)"/>
  <!-- zones the runs occupy -->
  <g fill="none" stroke="#ffffff" stroke-opacity="0.07" stroke-width="1.2"><path d="M40 120H600M40 240H600M220 40V360M420 40V360"/></g>
  <!-- secondary runs, dashed -->
  <g fill="none" stroke="#ffffff" stroke-opacity="0.3" stroke-width="2" stroke-dasharray="5 8" stroke-linecap="round">
    <path d="M150 300C220 296 268 268 312 226"/>
    <path d="M300 320C360 316 420 300 470 262"/>
  </g>
  <!-- the main run: a curved third-man movement into space -->
  <path d="M104 214C170 120 300 84 420 104C478 114 520 138 548 170" fill="none" stroke="url(#trail)" stroke-width="3.4" stroke-linecap="round" marker-end="url(#head)"/>
  <!-- motion echoes of the runner -->
  <g fill="none" stroke="#f3f3f3" stroke-width="2"><circle cx="104" cy="214" r="9" stroke-opacity="0.25"/><circle cx="176" cy="142" r="9" stroke-opacity="0.45"/></g>
  <circle cx="548" cy="170" r="10" fill="#08090a" stroke="#f3f3f3" stroke-width="2.4"/>
  <g fill="#08090a" stroke="#f3f3f3" stroke-width="2.4"><circle cx="150" cy="300" r="8"/><circle cx="300" cy="320" r="8"/></g>
  <circle cx="340" cy="210" r="5" fill="#f3f3f3"/>
  <rect width="640" height="400" fill="url(#fade)"/>
</svg>
