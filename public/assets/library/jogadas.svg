<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-label="Jogadas">
  <defs>
    <radialGradient id="light" cx="0.72" cy="0.18" r="0.7"><stop offset="0" stop-color="#ffffff" stop-opacity="0.1"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/></radialGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1"><stop offset="0.45" stop-color="#050607" stop-opacity="0"/><stop offset="1" stop-color="#050607" stop-opacity="0.92"/></linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.025"/></pattern>
    <marker id="head" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 1 8 5 0 9z" fill="#2F80FF"/></marker>
  </defs>
  <rect width="640" height="400" fill="#08090a"/>
  <rect width="640" height="400" fill="url(#grid)"/>
  <rect width="640" height="400" fill="url(#light)"/>
  <!-- attacking half: box, arc, goal -->
  <g fill="none" stroke="#ffffff" stroke-opacity="0.14" stroke-width="1.4">
    <path d="M560 40V360"/>
    <path d="M560 110H470V290H560"/>
    <path d="M560 160H526V240H560"/>
    <path d="M470 160A50 50 0 0 0 470 240"/>
    <path d="M80 40V360"/>
    <circle cx="80" cy="200" r="58" stroke-opacity="0.08"/>
  </g>
  <!-- off-ball run -->
  <path d="M250 300C320 286 390 270 452 236" fill="none" stroke="#ffffff" stroke-opacity="0.34" stroke-width="2" stroke-dasharray="6 7"/>
  <!-- the play: three touches to the box -->
  <path d="M120 250L238 172L356 214L486 168" fill="none" stroke="#2F80FF" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#head)"/>
  <g fill="#08090a" stroke="#f3f3f3" stroke-width="2.4">
    <circle cx="120" cy="250" r="9"/><circle cx="238" cy="172" r="9"/><circle cx="356" cy="214" r="9"/><circle cx="250" cy="300" r="7" stroke-opacity="0.55"/>
  </g>
  <circle cx="506" cy="160" r="6" fill="#f3f3f3"/>
  <rect width="640" height="400" fill="url(#fade)"/>
</svg>
