<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-label="Reviews">
  <defs>
    <radialGradient id="light" cx="0.3" cy="0.22" r="0.75"><stop offset="0" stop-color="#ffffff" stop-opacity="0.1"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/></radialGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1"><stop offset="0.5" stop-color="#050607" stop-opacity="0"/><stop offset="1" stop-color="#050607" stop-opacity="0.92"/></linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#151617"/><stop offset="1" stop-color="#0b0c0d"/></linearGradient>
  </defs>
  <rect width="640" height="400" fill="#08090a"/>
  <rect width="640" height="400" fill="url(#light)"/>
  <!-- the frame under review -->
  <rect x="96" y="52" width="448" height="214" rx="10" fill="url(#screen)" stroke="#ffffff" stroke-opacity="0.16" stroke-width="1.4"/>
  <g fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1.2">
    <path d="M320 52V266"/><circle cx="320" cy="159" r="36"/>
    <path d="M96 112H150V206H96M544 112H490V206H544"/>
  </g>
  <!-- annotation: a circled player and a drawn line -->
  <circle cx="252" cy="140" r="7" fill="#f3f3f3"/>
  <circle cx="252" cy="140" r="22" fill="none" stroke="#2F80FF" stroke-width="2.4"/>
  <path d="M274 148C318 168 362 172 404 160" fill="none" stroke="#2F80FF" stroke-width="2.4" stroke-linecap="round" stroke-dasharray="2 7"/>
  <circle cx="404" cy="160" r="6" fill="none" stroke="#f3f3f3" stroke-width="2"/>
  <!-- timeline with chapters and the playhead -->
  <path d="M96 304H544" stroke="#ffffff" stroke-opacity="0.18" stroke-width="2"/>
  <path d="M96 304H338" stroke="#f3f3f3" stroke-opacity="0.7" stroke-width="2"/>
  <g stroke="#ffffff" stroke-opacity="0.4" stroke-width="2"><path d="M168 296V312M246 296V312M422 296V312M490 296V312"/></g>
